
name: Snake Game Three - YouTube Live 11h20m

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snake-game-three-live
  cancel-in-progress: false

jobs:
  stream:
    name: Snake Game Three - Part ${{ matrix.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        part: [1, 2]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Streaming Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg xvfb pulseaudio wget \
            ca-certificates fonts-liberation

          wget -q -O /tmp/google-chrome.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb

          sudo apt-get install -y /tmp/google-chrome.deb

      - name: Start Virtual Display
        run: |
          Xvfb :99 -screen 0 1080x1920x24 \
            -ac +extension GLX +render -noreset \
            > /tmp/xvfb.log 2>&1 &

          sleep 3

      - name: Start Game Audio
        run: |
          pulseaudio --start --exit-idle-time=-1 || true

          pactl load-module module-null-sink \
            sink_name=GameAudio \
            sink_properties=device.description=GameAudio

          pactl set-default-sink GameAudio

          sleep 2

      - name: Start Snake Game Three
        env:
          DISPLAY: :99
          PULSE_SINK: GameAudio
        run: |
          if [ ! -f index.html ]; then
            echo "ERROR: index.html missing!"
            exit 1
          fi

          google-chrome \
            --no-sandbox \
            --no-first-run \
            --disable-dev-shm-usage \
            --disable-gpu \
            --disable-background-timer-throttling \
            --disable-renderer-backgrounding \
            --disable-backgrounding-occluded-windows \
            --autoplay-policy=no-user-gesture-required \
            --kiosk \
            --window-size=1080,1920 \
            --window-position=0,0 \
            "file://${GITHUB_WORKSPACE}/index.html" \
            > /tmp/chrome.log 2>&1 &

          sleep 10

      - name: Stream Snake Game Three
        shell: bash
        env:
          DISPLAY: :99
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          PART: ${{ matrix.part }}
        run: |
          set -u

          if [ -z "${YOUTUBE_STREAM_KEY:-}" ]; then
            echo "ERROR: YouTube Stream Key missing!"
            exit 1
          fi

          # Total target: 11 hours 20 minutes
          TOTAL_DURATION=$((11 * 3600 + 20 * 60))

          # Each part: 5 hours 40 minutes
          PART_DURATION=$((5 * 3600 + 40 * 60))

          END_TIME=$(($(date +%s) + PART_DURATION))

          echo "Snake Game Three"
          echo "Streaming Part: $PART"
          echo "Target total: $TOTAL_DURATION seconds"
          echo "Part duration: $PART_DURATION seconds"

          while true; do

            NOW=$(date +%s)
            REMAINING=$((END_TIME - NOW))

            if [ "$REMAINING" -le 0 ]; then
              echo "Part $PART completed."
              break
            fi

            echo "Remaining: $REMAINING seconds"

            ffmpeg \
              -nostdin \
              -hide_banner \
              -loglevel info \
              -stats \
              -stats_period 10 \
              -thread_queue_size 4096 \
              -f x11grab \
              -framerate 30 \
              -video_size 1080x1920 \
              -i :99.0 \
              -thread_queue_size 4096 \
              -f pulse \
              -i GameAudio.monitor \
              -t "$REMAINING" \
              -map 0:v:0 \
              -map 1:a:0 \
              -c:v libx264 \
              -preset ultrafast \
              -tune zerolatency \
              -pix_fmt yuv420p \
              -r 30 \
              -g 60 \
              -keyint_min 60 \
              -b:v 4500k \
              -maxrate 5000k \
              -bufsize 9000k \
              -c:a aac \
              -b:a 128k \
              -ar 44100 \
              -ac 2 \
              -f flv \
              "rtmp://a.rtmp.youtube.com/live2/${YOUTUBE_STREAM_KEY}"

            NOW=$(date +%s)

            if [ "$NOW" -ge "$END_TIME" ]; then
              break
            fi

            echo "FFmpeg disconnected."
            echo "Restarting in 5 seconds..."

            sleep 5

          done

          echo "Snake Game Three Part $PART finished."
